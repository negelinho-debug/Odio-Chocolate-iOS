
name: Odio FIX 1 - Player movement

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fix-player:
    runs-on: ubuntu-latest

    steps:
      - name: Download AssetRipper project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow extract-odio.yml \
            --limit 20 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId')

          test -n "$RUN_ID"
          test "$RUN_ID" != null

          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name Odio-Unity-Project \
            --dir project

      - name: Restore player and touch controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              p for p in Path("project").rglob("PlayerScript.cs")
              if "Assembly-CSharp" in str(p)
          ]
          if len(files) != 1:
              raise SystemExit("PlayerScript.cs not found")

          path = files[0]
          code = path.read_text(encoding="utf-8-sig")

          extra = """
          private int fixJoyFinger = -1;
          private Vector2 fixJoyOrigin;
          private Vector2 fixMove;
          private Vector2 fixLook;
          private float fixPitch;
          private float fixVertical;
          private bool fixRun;

          private void OnGUI()
          {
              if (Application.isMobilePlatform)
              {
                  fixRun = GUI.RepeatButton(
                      new Rect(Screen.width - 125,
                          Screen.height - 125, 110, 110),
                      "RUN");
              }
          }
          """

          code = code.replace(
              "private void Start()",
              extra + "\nprivate void Start()",
              1
          )

          def patch(method, body):
              global code
              pattern = (
                  r"(private void " + re.escape(method)
                  + r"\(\))\s*\{\s*\}"
              )
              code, count = re.subn(
                  pattern,
                  lambda m: m.group(1)
                      + "\n{\n" + body + "\n}",
                  code,
                  count=1
              )
              if count != 1:
                  raise SystemExit(
                      "Could not patch " + method
                  )

          patch("Start", """
              cc = cc != null
                  ? cc : GetComponent<CharacterController>();
              m_Camera = GetComponentInChildren<Camera>();
              if (m_Camera == null)
                  m_Camera = Camera.main;
              if (walkSpeed <= 0f) walkSpeed = 4f;
              if (runSpeed <= 0f) runSpeed = 7f;
              if (maxStamina <= 0f) maxStamina = 100f;
              if (staminaRate <= 0f) staminaRate = 12f;
              if (mouseSensitivity <= 0f)
                  mouseSensitivity = 2f;
              stamina = maxStamina;
          """)

          patch("Update", """
              if (gameOver || cameraCutscene) return;

              fixMove = Vector2.zero;
              fixLook = Vector2.zero;

              if (Application.isMobilePlatform)
              {
                  foreach (Touch touch in Input.touches)
                  {
                      if (touch.phase == TouchPhase.Began &&
                          touch.position.x <
                              Screen.width * 0.5f &&
                          fixJoyFinger == -1)
                      {
                          fixJoyFinger = touch.fingerId;
                          fixJoyOrigin = touch.position;
                      }

                      if (touch.fingerId == fixJoyFinger)
                      {
                          if (touch.phase ==
                              TouchPhase.Ended ||
                              touch.phase ==
                              TouchPhase.Canceled)
                          {
                              fixJoyFinger = -1;
                          }
                          else
                          {
                              fixMove =
                                  Vector2.ClampMagnitude(
                                  (touch.position -
                                      fixJoyOrigin) / 90f,
                                  1f);
                          }
                      }
                      else if (
                          touch.position.x >=
                              Screen.width * 0.5f &&
                          touch.position.y > 145f &&
                          touch.phase == TouchPhase.Moved)
                      {
                          fixLook += touch.deltaPosition;
                      }
                  }
              }

              MouseMove();
              PlayerMove();
              StaminaCheck();
          """)

          patch("MouseMove", """
              float sens = mouseSensitivity > 0f
                  ? mouseSensitivity : 2f;

              float x = Application.isMobilePlatform
                  ? fixLook.x * 0.045f * sens
                  : Input.GetAxis("Mouse X") * sens;

              float y = Application.isMobilePlatform
                  ? fixLook.y * 0.045f * sens
                  : Input.GetAxis("Mouse Y") * sens;

              transform.Rotate(0f, x, 0f);

              fixPitch = Mathf.Clamp(
                  fixPitch - y, -80f, 80f);

              if (m_Camera != null)
                  m_Camera.transform.localRotation =
                      Quaternion.Euler(fixPitch, 0f, 0f);
          """)

          patch("PlayerMove", """
              if (cc == null || !cc.enabled) return;

              Vector2 axes =
                  Application.isMobilePlatform
                  ? fixMove
                  : new Vector2(
                      Input.GetAxisRaw("Horizontal"),
                      Input.GetAxisRaw("Vertical"));

              axes = Vector2.ClampMagnitude(axes, 1f);

              bool running = Application.isMobilePlatform
                  ? fixRun
                  : Input.GetKey(KeyCode.LeftShift);

              bool canRun = running &&
                  axes.sqrMagnitude > 0.05f &&
                  stamina > 0f;

              playerSpeed = canRun
                  ? runSpeed : walkSpeed;

              Vector3 motion =
                  transform.right * axes.x +
                  transform.forward * axes.y;

              if (cc.isGrounded && fixVertical < 0f)
                  fixVertical = -2f;

              fixVertical -= 18f * Time.deltaTime;

              motion = motion * playerSpeed
                  + Vector3.up * fixVertical;

              cc.Move(motion * Time.deltaTime);
          """)

          patch("StaminaCheck", """
              bool moving =
                  Application.isMobilePlatform
                  ? fixMove.sqrMagnitude > 0.05f
                  : (Mathf.Abs(Input.GetAxisRaw(
                          "Horizontal")) +
                     Mathf.Abs(Input.GetAxisRaw(
                          "Vertical"))) > 0.1f;

              bool running =
                  Application.isMobilePlatform
                  ? fixRun
                  : Input.GetKey(KeyCode.LeftShift);

              stamina +=
                  (running && moving
                      ? -staminaRate
                      : staminaRate * 0.55f)
                  * Time.deltaTime;

              stamina = Mathf.Clamp(
                  stamina, 0f, maxStamina);

              if (staminaBar != null)
                  staminaBar.value =
                      maxStamina > 0f
                      ? stamina / maxStamina : 0f;
          """)

          path.write_text(code, encoding="utf-8")
          print("Patched:", path)
          PY

      - name: Upload restored project
        uses: actions/upload-artifact@v4
        with:
          name: Odio-FIX1-Unity-Project
          path: project/
          retention-days: 7
