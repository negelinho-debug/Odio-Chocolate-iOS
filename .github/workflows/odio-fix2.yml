
name: Odio FIX 2 - Prepare Unity Cloud

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find successful FIX 1
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow odio-fix1.yml \
            --limit 50 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No successful FIX 1 found"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download restored project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/odio"

          gh run download \
            "${{ steps.find.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name Odio-FIX1-Unity-Project \
            --dir "$RUNNER_TEMP/odio"

          test -f "$RUNNER_TEMP/odio/ExportedProject/ProjectSettings/ProjectVersion.txt"

      - name: Prepare Unity project
        run: |
          SRC="$RUNNER_TEMP/odio/ExportedProject"

          for DIR in Assets Packages ProjectSettings; do
            test -d "$SRC/$DIR"
            mkdir -p "$DIR"
            cp -a "$SRC/$DIR/." "$DIR/"
          done

          cat > .gitignore <<'EOF'
          [Ll]ibrary/
          [Tt]emp/
          [Oo]bj/
          [Bb]uild/
          [Bb]uilds/
          [Ll]ogs/
          [Uu]serSettings/
          .vs/
          .idea/
          *.csproj
          *.sln
          EOF

          echo "Unity project prepared!"
          cat ProjectSettings/ProjectVersion.txt

      - name: Check file sizes
        run: |
          BIG=$(find Assets Packages ProjectSettings \
            -type f -size +95M -print)

          if [ -n "$BIG" ]; then
            echo "Files too large for GitHub:"
            echo "$BIG"
            exit 1
          fi

      - name: Commit Unity project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Assets Packages ProjectSettings .gitignore

          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "FIX 2: Import restored Unity project"
            git push origin HEAD:main
          fi

      - name: Verify project
        run: |
          test -d Assets
          test -d Packages
          test -d ProjectSettings

          echo "Project uploaded to GitHub!"
          echo "Ready for Unity Cloud import test."
